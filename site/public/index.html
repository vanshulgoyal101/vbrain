<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>vbrain</title>
  <meta name="theme-color" content="#0c0d12" />
  <link rel="icon" type="image/svg+xml" href="/brain.svg" />
  <link rel="apple-touch-icon" href="/brain.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <button id="menuBtn" type="button" aria-label="Toggle menu">☰</button>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M19.938 10.5a4 4 0 0 1 .585.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M19.967 17.484A4 4 0 0 1 18 18"/></svg></span>
        <div>
          <div class="title">vbrain</div>
          <div class="who" id="who">…</div>
        </div>
      </div>
      <input id="search" type="search" placeholder="Search the brain…  ( / )" autocomplete="off" aria-label="Search" title="Operators: &quot;exact phrase&quot;, -exclude, section:career. Typos tolerated." />
      <div id="capture" class="capture" hidden>
        <textarea id="capText" rows="2" placeholder="Capture a thought… (⌘/Ctrl+Enter)"></textarea>
        <div class="caprow">
          <button id="capSave" type="button">Capture</button>
          <a id="inboxLink" href="#/inbox" class="inbox-link"></a>
        </div>
      </div>
      <nav id="nav" aria-label="Notes"></nav>
      <div class="foot">Private · Google sign-in · <kbd>/</kbd> search · <kbd>j</kbd>/<kbd>k</kbd> nav</div>
    </aside>
    <main id="main">
      <article id="content"><p class="muted">Loading…</p></article>
    </main>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
